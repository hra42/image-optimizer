# Publish verified main builds for edge GitOps. Release tags remain in docker.yaml.
when:
  - event: push
    branch: main
  - event: manual
    branch: main

depends_on: [ci]

steps:
  - name: publish
    image: woodpeckerci/plugin-kaniko:2
    settings:
      registry: ghcr.io
      repo: hra42/image-optimizer
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      dockerfile: Dockerfile
      tags:
        - main-${CI_PIPELINE_NUMBER}-${CI_COMMIT_SHA:0:7}
      build_args:
        - VERSION=${CI_COMMIT_SHA}
